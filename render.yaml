services:
  - type: web
    name: salim-ai-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp:app --workers 1 --threads 4 --timeout 90
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_NAME
        value: SALIM AI
